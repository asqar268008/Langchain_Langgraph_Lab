[project]
name = "langchain-langgraph-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asqar268008", email = "mdasqar007@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pinecone>=7.3.0",
    "psycopg-binary>=3.3.6",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
langchain-langgraph-lab = "langchain_langgraph_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
